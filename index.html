// ===== تذكير الواجبات متعدد القنوات (واتساب، SMS، وإيميل) =====
const APPURL=location.origin+location.pathname;
const DEF_HW_TMPL = "السلام عليكم ولي أمر الطالب {اسم_الطالب} 🌟\nنحيطكم علماً بوجود واجب منزلي لم يتم تسليمه في مادة {المادة}:\n📌 الواجب: *{اسم_الواجب}*\n⏰ آخر موعد للتسليم: *{موعد_التسليم}*\n🔗 رابط المنصة للمتابعة والتسليم:\n{رابط_المنصة}\nنتمنى لطلابنا التوفيق والاجتهاد! 🎓\n— {اسم_المعلم}";

function hwReminderMsg(tmpl, st, hwObj, tchObj){
  return (tmpl||DEF_HW_TMPL)
    .replace(/\{اسم_الطالب\}/g, st.name||"")
    .replace(/\{كود_الطالب\}/g, st.code||"")
    .replace(/\{المادة\}/g, (tchObj&&tchObj.spec)||teachSpec(st.tid)||"المادة")
    .replace(/\{اسم_الواجب\}/g, (hwObj&&hwObj.title)||"الواجب المنزلي")
    .replace(/\{موعد_التسليم\}/g, (hwObj&&hwObj.due)||today())
    .replace(/\{اسم_المعلم\}/g, (tchObj&&tchObj.name)||"إدارة المنصة")
    .replace(/\{رابط_المنصة\}/g, APPURL+(st.code?"?c="+st.code:""));
}

function hwSmsMsg(st, hwObj, tchObj){
  const spec = (tchObj&&tchObj.spec)||teachSpec(st.tid)||"المادة";
  const title = (hwObj&&hwObj.title)||"الواجب";
  const due = (hwObj&&hwObj.due)||today();
  const code = st.code||"";
  return `تذكير: لم يقم ${st.name} بتسليم واجب ${spec} (${title}). موعد التسليم: ${due}. الرابط: ${APPURL}${code?"?c="+code:""}`;
}

function hwEmailSubject(st, hwObj, tchObj){
  const spec = (tchObj&&tchObj.spec)||teachSpec(st.tid)||"المادة";
  return `إشعار موعد تسليم واجب ${spec} للطالب ${st.name} - منصة المجتهد`;
}

function hwEmailBody(st, hwObj, tchObj){
  const spec = (tchObj&&tchObj.spec)||teachSpec(st.tid)||"المادة";
  const title = (hwObj&&hwObj.title)||"الواجب المنزلي";
  const due = (hwObj&&hwObj.due)||today();
  const teacher = (tchObj&&tchObj.name)||"معلم المادة";
  return `السلام عليكم ورحمة الله وبركاته،\n\nنود تذكيركم بوجود واجب مدرسي متأخر لم يتم رفعه على منصة المجتهد التعليمية:\n\n- اسم الطالب: ${st.name}\n- المادة: ${spec}\n- عنوان الواجب: ${title}\n- الموعد النهائي للتسليم: ${due}\n- كود دخول الطالب: ${st.code}\n\nيرجى الدخول على المنصة وتسليم الحل مباشرة:\n${APPURL}${st.code?"?c="+st.code:""}\n\nمع تمنياتنا بالتفوق والنجاح،\nالأستاذ: ${teacher}\nإدارة منصة المجتهد التعليمية`;
}

function teachSpec(tid){ return (S.teachers[tid]||{}).spec||"المادة" }

function insertHwTag(tag){
  const el=$("hw_tmpl_box");
  if(!el)return;
  const start=el.selectionStart||0,end=el.selectionEnd||0;
  const val=el.value;
  el.value=val.substring(0,start)+tag+val.substring(end);
  q.hwTmpl=el.value;
  render();
}

function saveHwTmpl(){
  const t=(q.hwTmpl!==undefined?q.hwTmpl:$("hw_tmpl_box").value).trim();
  if(!t)return alert("لا يمكن حفظ قالب فارغ");
  db.ref("hw_templates/"+U.id).set(t).then(()=>alert("تم حفظ قالب رسالة التذكير بنجاح!"));
}

function sendMultiChannelAll(hwId, channel){
  const curHw=arr(S.hw).find(h=>h.id===hwId);
  if(!curHw)return;
  const St=arr(S.students).filter(s=>s.tid===U.id);
  const me=S.teachers[U.id]||{};
  const tmpl=q.hwTmpl!==undefined?q.hwTmpl:(S.hw_templates[U.id]||DEF_HW_TMPL);
  const missSt=St.filter(s=>!S.hwsub[curHw.id+"_"+s.id]);

  if(channel==='wa'){
    const target=missSt.filter(s=>s.pp);
    if(!target.length)return alert("لا يوجد طلاب لديهم أرقام هواتف مسجلة.");
    if(!confirm(`هل تريد بدء إرسال تذكير واتساب لـ ${target.length} طالب؟`))return;
    const R=target.map(x=>({n:x.name,p:x.pp,code:x.code,t:me.name||"",s:false,m:hwReminderMsg(tmpl,x,curHw,me)}));
    const rf=db.ref("wacamps").push({owner:U.id,title:"تذكير: "+curHw.title,text:"رسائل مخصّصة لكل طالب",at:Date.now(),r:R});
    rf.then(()=>{q.wc=rf.key;tab="wac";render()});
  } else if(channel==='sms'){
    const phones=missSt.filter(s=>s.pp).map(s=>String(s.pp).replace(/\D/g,"")).filter(Boolean);
    if(!phones.length)return alert("لا توجد أرقام هواتف مسجلة لإرسال SMS.");
    const sampleSt={name:"ابنكم/ابنتكم",code:""};
    const body=hwSmsMsg(sampleSt,curHw,me);
    location.href="sms:"+phones.join(",")+(navigator.userAgent.match(/iPhone|iPad|iPod/i)?"&":"?")+"body="+encodeURIComponent(body);
  } else if(channel==='email'){
    const emails=missSt.filter(s=>s.pe).map(s=>s.pe.trim()).filter(Boolean);
    if(!emails.length)return alert("لا توجد عناوين بريد إلكتروني مسجلة للطلاب المتأخرين.");
    const sampleSt={name:"ابنكم/ابنتكم",code:""};
    const sub=hwEmailSubject(sampleSt,curHw,me);
    const body=hwEmailBody(sampleSt,curHw,me);
    location.href="mailto:?bcc="+encodeURIComponent(emails.join(","))+"&subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body);
  }
}

function mark(sid,d,present){db.ref("attendance/"+sid+"_"+d).set({tid:U.id,sid,date:d,present})}
function joinOn(room){

function parseQuiz(txt){
  const blocks=String(txt||"").trim().split(/\n\s*\n/).map(b=>b.split("\n").map(l=>l.trim()).filter(Boolean)).filter(b=>b.length);
  const qs=[];
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i],raw=b.slice(1),o=raw.map(x=>x.replace(/^\*/,"").trim()),a=raw.findIndex(x=>x.startsWith("*")),cnt=raw.filter(x=>x.startsWith("*")).length;
    if(o.length<2||cnt!==1)return {err:"السؤال "+(i+1)+": اكتب خيارين على الأقل وعلّم الإجابة الصحيحة بنجمة * واحدة"};
    qs.push({q:b[0],o,a});
  }
  return qs.length?{qs}:{err:"اكتب سؤالًا واحدًا على الأقل"};
}

function wbDraw(){
  const c=$("wbc"),x=c.getContext("2d"),k=c.width/1000;x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.lineCap=x.lineJoin="round";
  WB.strokes.concat(WB.cur?[WB.cur]:[]).forEach(st=>{x.strokeStyle=st.c;x.lineWidth=st.w*k;x.beginPath();(st.p||[]).forEach((q,i)=>{i?x.lineTo(q[0]*k,q[1]*k):x.moveTo(q[0]*k,q[1]*k)});if((st.p||[]).length===1)x.lineTo(st.p[0][0]*k+.1,st.p[0][1]*k);x.stroke()});
}
function wbPt(e){const r=$("wbc").getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*10000)/10,Math.round((e.clientY-r.top)/r.height*6250)/10]}
